[project]
name = "business-intelligence-with-python"
version = "2.0.0"
description = "Companion code for the book 'Business Intelligence with Python', 2nd edition (ENI Editions)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core analysis, chapters 1 to 4
    "pandas>=3.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Spearman correlations (chapters 4 and 7) and seaborn density plots
    "scipy>=1.14",
    # File formats, chapter 2
    "openpyxl>=3.1",
    "pyarrow>=17.0",
    "lxml>=5.0",
    # Databases and extraction, chapters 2 and 5
    "sqlalchemy>=2.0",
    "duckdb>=1.1",
    "dlt[duckdb]>=1.0",
    # APIs and scraping, chapter 2
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "kagglehub>=1.0.2",
    "apscheduler>=3.11",
]

[dependency-groups]
# Installed on demand, chapter by chapter
# Chapter 3 profiles the dataset with DuckDB SUMMARIZE, already available
# through the main dependencies: no profiling library needed.
quality = ["skrub>=0.10"]
stats = ["scikit-learn>=1.5", "statsmodels>=0.14"]
# Chapter 8 needs streamlit>=1.60 for the bundled agent skills, and >=1.49
# for width="stretch", which replaced the removed use_container_width.
dashboards = ["streamlit>=1.60", "plotly>=6.0"]
orchestration = ["apache-airflow>=3.3", "apache-airflow-providers-standard>=1.17"]
reports = ["jupyter>=1.1", "papermill>=2.7", "nbconvert>=7.16"]

[tool.uv]
# This repo holds runnable scripts and exercise solutions, not a library:
# there is nothing to build or import.
package = false
